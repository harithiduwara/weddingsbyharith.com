<section class="pagehead">
  <div class="shell">
    <p class="eyebrow">{{collection.kind}}</p>
    <h1 class="pagehead__title">{{collection.title}}</h1>
    <p class="lede">{{collection.excerpt}}</p>
  </div>
</section>

<div class="shell">
  <dl class="collection__meta">
    {{#each collection.facts}}
    <div>
      <dt class="sr-only">{{label}}</dt>
      <dd class="plain">{{value}}</dd>
    </div>
    {{/each}}
  </dl>
</div>

<section class="section section--tight">
  <div class="shell">
    <div class="collection__story">
      {{#each collection.story}}
      <p>{{this}}</p>
      {{/each}}
    </div>
  </div>
</section>

<section class="section--tight">
  <div class="shell">
    <div class="gallery">
      {{#each collection.gallery}}
      <a class="gallery__item" href="{{full}}" data-alt="{{alt}}">{{{html}}}</a>
      {{/each}}
    </div>
  </div>
</section>

<div class="shell">
  <nav class="pager" aria-label="More collections">
    <a class="link-arrow" href="/portfolio/">All collections</a>
    <a class="link-arrow" href="/contact/">{{site.cta.label}}</a>
  </nav>
</div>

{{> cta-band }}

<article>
  <section class="pagehead">
    <div class="shell shell--narrow">
      <p class="article__meta meta-list">
        <span>{{post.dateDisplay}}</span><span>{{post.readingTime}} min read</span>
      </p>
      <h1 class="pagehead__title">{{post.title}}</h1>
      <p class="lede">{{post.excerpt}}</p>
    </div>
  </section>

  <div class="shell shell--narrow">{{{post.coverHtml}}}</div>

  <section class="section section--tight">
    <div class="shell shell--narrow">
      <div class="prose">{{{post.bodyHtml}}}</div>
      <p class="cluster mt-xl">{{#each post.tags}}<span class="tag">{{this}}</span>{{/each}}</p>
      <nav class="pager" aria-label="More writing">
        <a class="link-arrow" href="/journal/">All notes</a>
        <a class="link-arrow" href="/contact/">{{site.cta.label}}</a>
      </nav>
    </div>
  </section>
</article>

{{> cta-band }}

<dialog class="lightbox" id="lightbox" role="dialog" aria-labelledby="lightbox-title">
  <h2 class="sr-only" id="lightbox-title">Photograph viewer</h2>
  <div class="lightbox__bar">
    <span class="lightbox__count">1 / 1</span>
    <button class="lightbox__close" type="button">
      Close<span class="sr-only"> photograph viewer</span>
    </button>
  </div>
  <div class="lightbox__stage">
    <img
      src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
      alt=""
    />
  </div>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photograph">
    <span aria-hidden="true">←</span>
  </button>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photograph">
    <span aria-hidden="true">→</span>
  </button>
</dialog>

name: Bug report
description: Something on the site is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://weddingsbyharith.com/portfolio/
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Desktop, Phone, Tablet, Not sure]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 18 on iOS 18
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else

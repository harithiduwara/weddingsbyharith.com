<section class="pagehead">
  <div class="shell">
    <p class="eyebrow">Journal</p>
    <h1 class="pagehead__title">Notes, mostly practical</h1>
    <p class="lede">
      Things I find myself explaining on nearly every planning call, written down once so you can
      read them at your own pace.
    </p>
  </div>
</section>

<section class="section section--tight">
  <div class="shell">
    <div class="grid-3">
      {{#each journal}}
      <a class="card reveal" href="{{href}}">
        <div class="card__media">{{{coverHtml}}}</div>
        <h2 class="card__title">{{title}}</h2>
        <p class="card__meta meta-list">
          <span>{{dateDisplay}}</span><span>{{readingTime}} min read</span>
        </p>
        <p class="card__excerpt">{{excerpt}}</p>
      </a>
      {{/each}}
    </div>
  </div>
</section>

{{> cta-band }}

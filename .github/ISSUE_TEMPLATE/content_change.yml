name: Content change
description: Add or update a wedding, journal post, price or FAQ
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options: [New wedding gallery, Journal post, Pricing, FAQ, Copy edit, Other]
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: For a new gallery, include couple, venue, location, season and where the photographs are.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Permissions
      options:
        - label: The couple have given written permission for these photographs to be published
        - label: Any quoted testimonial is real and the client has agreed to it being used

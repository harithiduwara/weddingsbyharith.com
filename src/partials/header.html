<header class="header">
  <div class="shell header__inner">
    {{#if hasBrandLogo}}
    <a class="brand brand--mark" href="/">
      {{{brandLogo}}}<span class="sr-only">{{site.name}} — home</span>
    </a>
    {{else}}
    <a class="brand" href="/">Harith Iduwara<span>Weddings</span></a>
    {{/if}}

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list">
        {{#each navItems}}
        <li><a class="nav__link" href="{{href}}"{{#if current}} aria-current="page"{{/if}}>{{label}}</a></li>
        {{/each}}
      </ul>
    </nav>

    <a class="btn btn--on-image header__cta" href="{{site.cta.href}}">{{site.cta.label}}</a>

    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-drawer">
      <span></span><span></span><span></span>
      <span class="sr-only">Menu</span>
    </button>
  </div>
</header>

<dialog class="drawer" id="nav-drawer" role="dialog" aria-labelledby="nav-drawer-title">
  <h2 class="sr-only" id="nav-drawer-title">Menu</h2>
  <button class="drawer__close" type="button" aria-label="Close menu">
    <span aria-hidden="true">&times;</span>
  </button>
  {{#each site.nav}}<a href="{{href}}">{{label}}</a>{{/each}}
  <a href="{{site.cta.href}}">{{site.cta.label}}</a>
</dialog>

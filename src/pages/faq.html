<section class="pagehead">
  <div class="shell shell--narrow">
    <p class="eyebrow">FAQ</p>
    <h1 class="pagehead__title">The questions everyone asks</h1>
    <p class="lede">And a few they should. If yours is not here, just ask — I would rather answer it now than after you have booked.</p>
  </div>
</section>

<section class="section section--tight">
  <div class="shell shell--narrow">
    <div class="faq">
      {{#each faqs}}
      <details class="faq__item"{{#if @first}} open{{/if}}>
        <summary class="faq__q">{{q}}</summary>
        <div class="faq__a"><p>{{a}}</p></div>
      </details>
      {{/each}}
    </div>
  </div>
</section>

{{> cta-band }}

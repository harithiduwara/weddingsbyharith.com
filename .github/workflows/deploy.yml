# Optional Actions-based deployment.
#
# The project currently deploys with `npm run deploy`, which pushes dist/ to the
# gh-pages branch — see ADR-0002. This workflow is the migration path. To adopt
# it: enable it below, then set Settings → Pages → Source to "GitHub Actions".
#
# Pushing this file requires a token with the `workflow` scope:
#   gh auth refresh -s workflow

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build -- --production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
